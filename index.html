<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KUET Civil '25 — Engineers' Deck</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-void: #030712; 
    --bg-deep: #0b0f17; 
    --bg-surface: #111827;
    --bg-card: #1f2937;
    --border: rgba(197, 160, 89, 0.12);
    --border-hover: rgba(197, 160, 89, 0.35);
    --gold: #c5a059; 
    --gold-muted: #8a6f3e;
    --gold-glow: rgba(197, 160, 89, 0.04);
    --blueprint-line: rgba(255, 255, 255, 0.015);
    --text-primary: #f3f4f6;
    --text-secondary: #9ca3af;
    --text-muted: #6b7280;
    --shadow-overlay: radial-gradient(circle at 50% -20%, rgba(197, 160, 89, 0.08) 0%, transparent 60%);
  }

  .light {
    --bg-void: #f9fafb;
    --bg-deep: #f3f4f6;
    --bg-surface: #e5e7eb;
    --bg-card: #ffffff;
    --border: rgba(197, 160, 89, 0.15);
    --border-hover: rgba(197, 160, 89, 0.4);
    --gold: #b3893b; 
    --gold-muted: #8a6f3e;
    --gold-glow: rgba(197, 160, 89, 0.05);
    --blueprint-line: rgba(0, 0, 0, 0.025);
    --text-primary: #111827;
    --text-secondary: #4b5563;
    --text-muted: #9ca3af;
    --shadow-overlay: radial-gradient(circle at 50% -20%, rgba(197, 160, 89, 0.04) 0%, transparent 60%);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg-void);
    color: var(--text-primary);
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    transition: background 0.3s, color 0.3s;
  }

  .blueprint-bg {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(var(--blueprint-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--blueprint-line) 1px, transparent 1px);
    background-size: 60px 60px;
  }
  .blueprint-bg::after {
    content: ''; position: absolute; inset: 0;
    background: var(--shadow-overlay), radial-gradient(circle at 80% 80%, rgba(0,0,0,0.4) 0%, transparent 100%);
  }

  header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(3, 7, 18, 0.85); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border);
    transition: background 0.3s;
  }
  .light header { background: rgba(249, 250, 251, 0.85); }

  .header-inner {
    max-width: 1280px; margin: 0 auto; padding: 0 24px;
    display: flex; align-items: center; justify-content: space-between; height: 72px;
  }
  .logo-text .title { font-family: 'Rajdhani', sans-serif; font-size: 22px; font-weight: 700; color: var(--text-primary); letter-spacing: 0.03em; }
  .logo-text .sub { font-size: 11px; font-weight: 500; color: var(--gold-muted); letter-spacing: 0.12em; text-transform: uppercase; font-family: 'JetBrains Mono', monospace; }
  
  .mode-toggle {
    width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; 
    background: var(--bg-deep); border: 1px solid var(--border); border-radius: 8px; 
    color: var(--text-secondary); cursor: pointer; transition: all 0.2s ease;
  }
  .mode-toggle:hover { border-color: var(--gold); color: var(--gold); transform: scale(1.05); }

  .main-wrap { position: relative; z-index: 1; max-width: 1280px; margin: 0 auto; padding: 40px 24px 80px; }
  
  .page-hero h1 { font-family: 'Rajdhani', sans-serif; font-size: clamp(36px, 5vw, 56px); font-weight: 700; line-height: 1.05; color: var(--text-primary); }
  .page-hero h1 span { color: var(--gold); }
  .page-hero p { margin-top: 10px; color: var(--text-secondary); font-size: 13px; font-family: 'JetBrains Mono', monospace; letter-spacing: 1px; }

  .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin: 40px 0; }
  .stat-card { background: var(--bg-deep); border: 1px solid var(--border); border-radius: 12px; padding: 20px 24px; position: relative; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
  .stat-card .label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; font-family: 'JetBrains Mono', monospace; margin-bottom: 4px; }
  .stat-card .value { font-family: 'Rajdhani', sans-serif; font-size: 32px; font-weight: 700; color: var(--gold); }

  .tab-bar { display: flex; gap: 8px; margin-bottom: 28px; border-bottom: 1px solid var(--border); }
  .tab-btn { font-size: 15px; font-weight: 500; padding: 12px 24px; border: none; background: none; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; display: flex; align-items: center; gap: 8px; }
  .tab-btn:hover { color: var(--text-secondary); }
  .tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); font-weight: 600; }
  .tab-count { font-family: 'JetBrains Mono', monospace; font-size: 11px; background: var(--gold-glow); color: var(--gold); border: 1px solid var(--border); padding: 1px 6px; border-radius: 6px; }

  .search-input { width: 100%; background: var(--bg-deep); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px 12px 42px; color: var(--text-primary); font-size: 14px; outline: none; transition: all 0.2s; }
  .search-input:focus { border-color: var(--gold); box-shadow: 0 0 12px rgba(197, 160, 89, 0.1); }
  
  .add-btn { display: flex; align-items: center; gap: 8px; background: var(--gold); color: var(--bg-void); font-weight: 600; font-size: 14px; border: none; border-radius: 10px; padding: 12px 20px; cursor: pointer; transition: all 0.2s; }
  .add-btn:hover { background: #b59049; transform: translateY(-1px); }

  .content-list { display: flex; flex-direction: column; gap: 14px; }
  .content-card { background: var(--bg-deep); border: 1px solid var(--border); border-left: 4px solid var(--gold); border-radius: 12px; padding: 24px; display: flex; justify-content: space-between; align-items: center; transition: all 0.2s; box-shadow: 0 4px 15px rgba(0,0,0,0.15); }
  .content-card:hover { border-color: var(--border-hover); transform: translateX(2px); }
  .content-card-title { font-size: 18px; font-weight: 600; color: var(--text-primary); margin-bottom: 6px; }
  .card-meta-row { display: flex; gap: 16px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-muted); margin-top: 8px; }

  .profile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
  .profile-card { background: var(--bg-deep); border: 1px solid var(--border); border-radius: 14px; padding: 28px 20px; text-align: center; transition: all 0.25s ease; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
  .profile-card:hover { border-color: var(--border-hover); transform: translateY(-4px); }
  .avatar { width: 72px; height: 72px; border-radius: 50%; background: var(--bg-surface); border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; font-family: 'Rajdhani', sans-serif; font-size: 24px; font-weight: 700; color: var(--gold); }

  .badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--gold-glow); color: var(--gold); text-decoration: none; transition: all 0.2s; cursor: pointer; }
  .badge:hover { background: var(--gold); color: var(--bg-void); border-color: var(--gold); }

  .modal-overlay { position: fixed; inset: 0; z-index: 1000; background: rgba(3, 7, 18, 0.5); backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal { background: var(--bg-deep); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 540px; padding: 28px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
  
  .form-group { margin-bottom: 18px; }
  .form-label { display: block; font-size: 11px; color: var(--text-muted); text-transform: uppercase; font-family: 'JetBrains Mono', monospace; margin-bottom: 6px; }
  .form-input, .form-textarea { width: 100%; background: var(--bg-surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px; color: var(--text-primary); font-size: 14px; outline: none; }

  .skeleton { background: linear-gradient(90deg, var(--bg-deep) 25%, var(--bg-surface) 50%, var(--bg-deep) 75%); background-size: 200% 100%; animation: loadingShimmer 1.6s infinite; border-radius: 12px; }
  @keyframes loadingShimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

  #docViewerModal { position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; padding: 20px; }
  #docViewerModal.hidden { display: none; }

  /* নতুন প্রিমিয়াম সাকসেস পপ-আপ অ্যানিমেশন ও স্টাইল */
  .success-overlay { position: fixed; inset: 0; z-index: 3000; background: rgba(3, 7, 18, 0.6); backdrop-filter: blur(14px); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
  .success-overlay.open { opacity: 1; pointer-events: all; }
  .success-box { background: var(--bg-deep); border: 1px solid rgba(34, 197, 94, 0.2); border-radius: 20px; width: 90%; max-width: 400px; padding: 32px 24px; text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,0.6); transform: scale(0.9); transition: transform 0.3s ease; }
  .success-overlay.open .success-box { transform: scale(1); }
</style>
</head>
<body>

<div class="blueprint-bg"></div>

<header>
  <div class="header-inner">
    <div class="flex items-center gap-4">
      <div class="logo-text">
        <div class="title">KUET Civil '25</div>
        <div class="sub">Academic Infrastructure</div>
      </div>
    </div>
    <div class="flex items-center gap-4">
      <button class="mode-toggle" onclick="toggleMode()">
        <svg id="modeIcon" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M20.35 12.01A8 8 0 1111.99 4.02a1.5 1.5 0 001.32.72.5.5 0 00.51-.51.5.5 0 00-.09-.3A8.04 8.04 0 0120.35 12.01z"></path>
        </svg>
      </button>
      <div style="font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--gold); border:1px solid var(--border); padding:6px 12px; border-radius:6px;">
        ● DATABASE PIPELINE READY
      </div>
    </div>
  </div>
</header>

<main class="main-wrap">
  <div class="page-hero">
    <h1>Engineers' <span>Deck</span></h1>
    <p>// Department of Civil Engineering • KUET</p>
  </div>

  <div class="stats-row">
    <div class="stat-card"><div class="label">Notice Board</div><div class="value" id="stat-notices">0</div></div>
    <div class="stat-card"><div class="label">Academic Vault</div><div class="value" id="stat-resources">0</div></div>
    <div class="stat-card"><div class="label">Student Directory</div><div class="value" id="stat-family">0</div></div>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab(event, 'notices')">Notice Board <span class="tab-count" id="cnt-notices">0</span></button>
    <button class="tab-btn" onclick="switchTab(event, 'resources')">Academic Vault <span class="tab-count" id="cnt-resources">0</span></button>
    <button class="tab-btn" onclick="switchTab(event, 'family')">Members <span class="tab-count" id="cnt-family">0</span></button>
  </div>

  <div class="flex gap-4 mb-8 items-center flex-wrap">
    <div class="relative flex-1 min-w-[260px]">
      <input class="search-input" id="search-input" type="text" placeholder="Search data matrix..." oninput="handleSearch(this.value)">
    </div>
    <button class="add-btn" onclick="openFormModal()">+ Add New Entry</button>
  </div>

  <div id="content-area">
    <div id="panel-notices" class="tab-panel block"><div class="content-list" id="notices-list"></div></div>
    <div id="panel-resources" class="tab-panel hidden"><div class="content-list" id="resources-list"></div></div>
    <div id="panel-family" class="tab-panel hidden"><div class="profile-grid" id="family-list"></div></div>
  </div>
</main>

<div id="docViewerModal" class="hidden">
  <div style="position:relative; width:100%; max-width:960px; height:85vh; background:var(--bg-deep); border:1px solid var(--border); border-radius:14px; display:flex; flex-direction:column; overflow:hidden;">
    <div style="padding:16px; background:var(--bg-void); display:flex; justify-content:space-between; border-bottom:1px solid var(--border)">
      <h4 id="modalTitle" style="color:var(--gold); font-weight:600;">Document Viewer</h4>
      <button onclick="closeDocViewer()" style="color:#ef4444; font-weight:bold;">✕ Close</button>
    </div>
    <iframe id="docFrame" src="" style="width:100%; flex:1; background:white; border:none;"></iframe>
  </div>
</div>

<iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(typeof submitted !== 'undefined' && submitted) { handleSubmissionSuccess(); }"></iframe>

<div class="modal-overlay" id="form-modal">
  <div class="modal">
    <div style="display:flex; justify-content:space-between; border-bottom:1px solid var(--border); padding-bottom:14px; margin-bottom:24px;">
      <h3 id="modal-title-text" style="color:var(--gold); font-weight:700;">Form</h3>
      <button onclick="closeFormModal()" style="color:#ef4444;">✕</button>
    </div>
    <form id="submissionForm" method="POST" target="hidden_iframe">
      <div id="dynamic-form-fields"></div>
      <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:28px;">
        <button type="button" onclick="closeFormModal()" style="border:1px solid var(--border); padding:10px 20px; color:var(--text-secondary);">Cancel</button>
        <button id="modal-submit-btn" type="submit" onclick="submitted=true" style="background:var(--gold); color:var(--bg-void); font-weight:600; padding:10px 24px; border-radius:8px;">Submit</button>
      </div>
    </form>
  </div>
</div>

<div class="success-overlay" id="successAlertModal">
  <div class="success-box">
    <div class="flex items-center justify-center mx-auto mb-5 w-16 h-16 rounded-full bg-green-500/10 border border-green-500/30 text-green-500">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
      </svg>
    </div>
    <h3 style="font-family:'Rajdhani', sans-serif; font-size: 24px; font-weight: 700; color: var(--text-primary); margin-bottom: 8px;">Submission Received!</h3>
    <p style="font-size: 14px; color: #22c55e; font-weight: 500; font-family:'JetBrains Mono', monospace; margin-bottom: 24px;">● Waiting for Admin approval</p>
    <button onclick="closeSuccessModal()" style="width:100%; background:#22c55e; color:#030712; font-weight:700; padding:12px; border-radius:10px; font-size:14px; transition:all 0.2s;" onmouseover="this.style.background='#16a34a'" onmouseout="this.style.background='#22c55e'">Acknowledged</button>
  </div>
</div>

<script>
  const CONFIG = {
    GAS_URL: 'https://script.google.com/macros/s/AKfycbxxG5LYFkppdBeF5wHaQU4Q9aZp3DHSrzrht0JTGUlGgKJQw_JrgoIg2uekuikrAl5-9A/exec'
  };

  let currentTab = 'notices';
  let serverData = { notices: [], resources: [], family: [] };
  let searchQuery = "";
  let submitted = false; 

  document.getElementById('submissionForm').action = CONFIG.GAS_URL;

  function toggleMode() {
    const html = document.documentElement;
    const icon = document.getElementById('modeIcon');
    if (html.classList.contains('light')) {
      html.classList.remove('light'); html.classList.add('dark');
      icon.innerHTML = `<path d="M20.35 12.01A8 8 0 1111.99 4.02a1.5 1.5 0 001.32.72.5.5 0 00.51-.51.5.5 0 00-.09-.3A8.04 8.04 0 0120.35 12.01z"></path>`;
    } else {
      html.classList.remove('dark'); html.classList.add('light');
      icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2m0 14v2m9-9h-2M4 12H2m15.364-6.364l-1.414 1.414M7.05 16.95l-1.414 1.414M16.95 16.95l1.414 1.414M7.05 4.05l1.414 1.414M12 8a4 4 0 100 8 4 4 0 000-8z" />`;
    }
  }

  function fixDriveUrl(url) {
  if (url && url.includes('drive.google.com')) {
    // লিংকের ভেতর থেকে ফাইল আইডি (File ID) বের করার সবচেয়ে শক্তিশালী নিয়ম
    const matches = url.match(/(?:\/d\/|id=)([^/?&]+)/);
    if (matches && matches[1]) {
      // preview লিংক গুগলের iframe ব্লকিংকে শতভাগ বাইপাস করে
      return `https://drive.google.com/file/d/${matches[1]}/preview`;
    }
  }
  return url || '#';
}

  async function loadData() {
    showSkeletons();
    try {
      const response = await fetch(`${CONFIG.GAS_URL}?t=${new Date().getTime()}`, {
        method: 'GET',
        mode: 'cors',
        redirect: 'follow'
      });
      const result = await response.json();
      if(result.status === "success" && result.data) {
        serverData = result.data;
        console.log("Database Connection Established & Streamed!", serverData);
      }
    } catch (err) {
      console.error("Execution halt during fetch stream ingestion.", err);
    }
    updateUI();
  }

  function showSkeletons() {
    const skeletonBlock = `<div class="skeleton w-full mb-2" style="height:115px;"></div>`;
    document.getElementById('notices-list').innerHTML = skeletonBlock;
    document.getElementById('resources-list').innerHTML = skeletonBlock;
    document.getElementById('family-list').innerHTML = `<div class="skeleton w-full h-48"></div>`;
  }

  function getValidItems(arr, isFamily = false) {
    return arr.filter(item => {
      const st = item.status ? item.status.toLowerCase().trim() : '';
      if (st === 'pending') return false;
      if (isFamily) {
        return item.name || item.roll;
      }
      return true;
    });
  }

  function updateUI() {
    const validNotices = getValidItems(serverData.notices);
    const validResources = getValidItems(serverData.resources);
    const validFamily = getValidItems(serverData.family, true);

    document.getElementById('cnt-notices').innerText = validNotices.length;
    document.getElementById('cnt-resources').innerText = validResources.length;
    document.getElementById('cnt-family').innerText = validFamily.length;

    document.getElementById('stat-notices').innerText = validNotices.length;
    document.getElementById('stat-resources').innerText = validResources.length;
    document.getElementById('stat-family').innerText = validFamily.length;

    renderCurrentTab();
  }

  function switchTab(event, tabName) {
    currentTab = tabName;
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    if(event && event.currentTarget) {
      event.currentTarget.classList.add('active');
    }
    
    document.querySelectorAll('.tab-panel').forEach(pnl => { pnl.classList.add('hidden'); pnl.classList.remove('block'); });
    document.getElementById(`panel-${tabName}`).classList.remove('hidden');
    document.getElementById(`panel-${tabName}`).classList.add('block');
    
    renderCurrentTab();
  }

  function handleSearch(val) {
    searchQuery = val.toLowerCase();
    renderCurrentTab();
  }

  function renderCurrentTab() {
    const baseDataset = serverData[currentTab] || [];
    
    const filtered = baseDataset.filter(item => {
      const st = item.status ? item.status.toLowerCase().trim() : '';
      if (st === 'pending') return false; 
      if (currentTab === 'family' && !item.name && !item.roll) return false;
      
      return Object.values(item).join(' ').toLowerCase().includes(searchQuery);
    });

    let renderedHtml = '';

    if (currentTab === 'notices') {
      filtered.forEach(item => {
        renderedHtml += `
          <div class="content-card mb-3">
            <div>
              <div class="form-label" style="color: var(--gold-muted);">${item.category || 'GENERAL'}</div>
              <h4 class="content-card-title">${item.title || 'No Title'}</h4>
              <p style="color: var(--text-secondary); font-size: 14px;">${item.description || ''}</p>
              <div class="card-meta-row"><span>📅 Date: ${item.date ? item.date.substring(0,10) : 'N/A'}</span></div>
            </div>
            ${item.link ? `<button onclick="openDocViewer('${item.link}', '${item.title}')" class="badge">Open Document</button>` : ''}
          </div>`;
      });
      document.getElementById('notices-list').innerHTML = renderedHtml || '<p style="color:var(--text-muted); padding:24px;">No notices available.</p>';
    } 
    else if (currentTab === 'resources') {
      filtered.forEach(item => {
        renderedHtml += `
          <div class="content-card mb-3">
            <div>
              <div class="form-label" style="color: var(--gold-muted);">${item.type || 'DOCUMENT'}</div>
              <h4 class="content-card-title">${item.subject || 'No Subject'}</h4>
              <p style="color: var(--text-secondary); font-size: 14px;">Topic: ${item.topic || ''}</p>
              <div class="card-meta-row"><span>📅 Added: ${item.date ? item.date.substring(0,10) : 'N/A'}</span></div>
            </div>
            <button onclick="openDocViewer('${item.link}', '${item.topic}')" class="badge">Fetch Resource</button>
          </div>`;
      });
      document.getElementById('resources-list').innerHTML = renderedHtml || '<p style="color:var(--text-muted); padding:24px;">No resources synced.</p>';
    } 
    else if (currentTab === 'family') {
      filtered.forEach(item => {
        const initials = item.name ? item.name.split(' ').map(n => n[0]).join('').substring(0,2).toUpperCase() : 'CE';
        renderedHtml += `
          <div class="profile-card">
            <div class="avatar">${initials}</div>
            <div style="font-size:16px; font-weight:600; margin-bottom:4px;">${item.name || 'Unknown'}</div>
            <div style="font-size:13px; color:var(--text-muted);">Roll: ${item.roll || 'N/A'}</div>
            <div style="font-size:13px; color:var(--text-muted); margin-bottom: 16px;">Email: ${item.email || 'N/A'}</div>
            ${item.fb ? `<a href="${item.fb}" target="_blank" class="badge w-full justify-center">Portfolio Link</a>` : ''}
          </div>`;
      });
      document.getElementById('family-list').innerHTML = renderedHtml || '<p style="color:var(--text-muted); padding:24px;">No members synced.</p>';
    }
  }

  function openDocViewer(url, title) {
  // যদি লিংকটি কোনো ড্রাইভ ফোল্ডারের হয়, তবে সেটি ইন-অ্যাপ ভিউয়ারে না খুলে সরাসরি নতুন ট্যাবে ওপেন হবে
  if (url && url.includes('drive.google.com/drive/folders')) {
    window.open(url, '_blank');
    return; // ফাংশন এখানেই শেষ, নিচের ইন-অ্যাপ ভিউয়ার আর খুলবে না
  }

  // নরমাল পিডিএফ বা ফাইল হলে আগের মতোই ইন-অ্যাপ ভিউয়ারে খুলবে
  document.getElementById('modalTitle').innerText = title;
  document.getElementById('docFrame').src = fixDriveUrl(url);
  document.getElementById('docViewerModal').classList.remove('hidden');
}
  function closeDocViewer() {
    document.getElementById('docViewerModal').classList.add('hidden');
    document.getElementById('docFrame').src = '';
  }

  function openFormModal() {
    let entryFields = `<input type="hidden" name="sheet" value="${currentTab}">`;
    
    if (currentTab === 'notices') {
      document.getElementById('modal-title-text').innerText = "Post New Academic Bulletin";
      entryFields += `
        <div class="form-group"><label class="form-label">Notice Title</label><input type="text" name="title" class="form-input" required></div>
        <div class="form-group"><label class="form-label">Notice Classification</label><input type="text" name="category" class="form-input" placeholder="e.g., Exam, Event"></div>
        <div class="form-group"><label class="form-label">Link to Attached Document</label><input type="url" name="link" class="form-input"></div>
        <div class="form-group"><label class="form-label">Summary / Detailed Content</label><textarea name="description" class="form-textarea" rows="3"></textarea></div>
        <div class="form-group"><label class="form-label">Publish Date</label><input type="date" name="date" class="form-input" required></div>`;
    } else if (currentTab === 'resources') {
      document.getElementById('modal-title-text').innerText = "Upload Academic Resource";
      entryFields += `
        <div class="form-group"><label class="form-label">Course Name / Code</label><input type="text" name="subject" class="form-input" required></div>
        <div class="form-group"><label class="form-label">Key Topic</label><input type="text" name="topic" class="form-input" required></div>
        <div class="form-group"><label class="form-label">Link to Resource File</label><input type="url" name="link" class="form-input" required></div>
        <div class="form-group"><label class="form-label">Document Type</label><input type="text" name="type" class="form-input" placeholder="e.g., PDF, Slides"></div>
        <div class="form-group"><label class="form-label">Date of Addition</label><input type="date" name="date" class="form-input" required></div>`;
    } else if (currentTab === 'family') {
      document.getElementById('modal-title-text').innerText = "Add New Student Profile";
      entryFields += `
        <div class="form-group"><label class="form-label">Full Name</label><input type="text" name="name" class="form-input" required></div>
        <div class="form-group"><label class="form-label">Student ID</label><input type="text" name="roll" class="form-input" required></div>
        <div class="form-group"><label class="form-label">Email</label><input type="email" name="email" class="form-input"></div>
        <div class="form-group"><label class="form-label">Link to Portfolio</label><input type="url" name="fb" class="form-input"></div>`;
    }
    
    document.getElementById('dynamic-form-fields').innerHTML = entryFields;
    document.getElementById('form-modal').classList.add('open');
  }

  function closeFormModal() {
    document.getElementById('form-modal').classList.remove('open');
    document.getElementById('submissionForm').reset();
    submitted = false;
  }

  function handleSubmissionSuccess() {
    closeFormModal();
    // সাধারণ alert সরাইয়া নতুন প্রিমিয়াম পপ-আপ ওপেন করা হচ্ছে
    document.getElementById('successAlertModal').classList.add('open');
    loadData(); 
  }

  function closeSuccessModal() {
    document.getElementById('successAlertModal').classList.remove('open');
  }

  window.addEventListener('DOMContentLoaded', loadData);
</script>
</body>
</html>
